<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - 2 Player</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b16;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            user-select: none;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        #status {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ff0055;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: #141426;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 2px solid #00ffcc;
        }
        .cell {
            background: #1f1f38;
            border: none;
            border-radius: 10px;
            font-size: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .cell:hover {
            background: #2a2a4e;
            transform: scale(1.05);
        }
        .cell.x {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .cell.o {
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255,0,85,0.5);
        }
        #restart {
            margin-top: 25px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.3);
            transition: 0.2s;
        }
        #restart:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div id="status">Spieler X ist am Zug</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>
        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>
        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>
    </div>

    <button id="restart" onclick="resetGame()">Neues Spiel</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Reihen
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Spalten
            [0, 4, 8], [2, 4, 6]             // Diagonalen
        ];

        const statusDisplay = document.getElementById("status");
        const cells = document.querySelectorAll(".cell");

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            cells[index].innerText = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                let [a, b, c] = winningConditions[i];
                if (board[a] === "" || board[b] === "" || board[c] === "") continue;
                if (board[a] === board[b] && board[b] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `Spieler ${currentPlayer} hat gewonnen! 🎉`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusDisplay.innerText = `Unentschieden! 🤝`;
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `Spieler ${currentPlayer} ist am Zug`;
        }

            board = ["", "", "", "", "", "", "", "",
